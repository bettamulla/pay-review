name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          AUTH_SECRET: ci-only-dummy-secret
          DATABASE_URL: postgres://placeholder@localhost:5432/placeholder
          APP_URL: http://localhost:3000
      - name: DB smoke test (PGlite)
        run: npx tsx src/db/smoke-test.ts
